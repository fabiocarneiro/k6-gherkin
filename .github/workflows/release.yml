name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        id: bump
        run: |
          TAG_COUNT=$(git tag -l "v*" | wc -l)
          if [ "$TAG_COUNT" -eq 0 ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "First release detected! Releasing initial version $CURRENT_VERSION."
            echo "VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            npm version ${{ inputs.bump_type }} --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "Bumping version (${{ inputs.bump_type }}) to $NEW_VERSION."
            echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Commit version bump and tag
        run: |
          VERSION="${{ steps.bump.outputs.VERSION }}"
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore: release v${VERSION}" || true
          git tag "v${VERSION}"
          git push origin master
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.VERSION }}"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      - name: Publish to npm with OIDC Provenance
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up GitHub Packages Registry
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
